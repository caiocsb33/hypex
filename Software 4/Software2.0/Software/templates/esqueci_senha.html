<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esqueci minha senha</title>

    <!-- CSS da página -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style_esquecisenha.css') }}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='notificacoes.css') }}">

</head>

<body>

    <!-- =========================
         ALERTAS
    ========================== -->



    <!-- =========================
         CONTAINER PRINCIPAL
    ========================== -->

    <div class="login-container">

        <div class="login-card">


            <!-- =========================
                 PAINEL AZUL
            ========================== -->

            <div class="card-cad">

                <img
                    src="{{ url_for('static', filename='imagem/logo.png') }}"
                    alt="HypeX"
                    class="logo"
                >

                <h4>
                    Recuperar senha
                </h4>

                <p>
                    Informe seu e-mail para receber as instruções.
                </p>

                <div class="copyright">
                    © 2025 HYPE X - Sistema de Estoque.
                </div>

            </div>


            <!-- =========================
                 FORMULÁRIO
            ========================== -->

            <form
                method="POST"
                action="{{ url_for('esqueci_senha') }}"
            >

                <div class="forms">

                    <h2>
                        ESQUECI MINHA SENHA
                    </h2>

                    <p class="descricao">
                        Digite seu e-mail abaixo para recuperar sua senha.
                    </p>


                    <!-- E-MAIL -->

                    <div class="campo-email">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="Digite seu email"
                                required
                                autocomplete="email"
                            >

                        </div>

                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Enviar link
                    </button>


                    <!-- VOLTAR PARA LOGIN -->

                    <div class="login-links">

                        <div class="link-senha">

                            <a
                                href="{{ url_for('login') }}"
                                class="esqueci-senha"
                            >
                                Voltar para o login
                            </a>

                        </div>

                    </div>

                </div>

            </form>


        </div>

    </div>


    <!-- =========================
         SCRIPT DOS ALERTAS
    ========================== -->

    <script>

        setTimeout(() => {

            const alerts = document.querySelectorAll('.alert');

            alerts.forEach(alert => {

                alert.style.opacity = '0';

                setTimeout(() => {
                    alert.remove();
                }, 500);

            });

        }, 3000);

    </script>

    {% include '_notificacoes.html' %}

</body>

</html>
