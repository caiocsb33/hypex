<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Software HYPEX{% endblock %}</title>

    <script>
        if (localStorage.getItem("sidebarMinimizada") === "true") {
            document.documentElement.classList.add("sidebar-pre-minimizada");
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS global -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- CSS específico de cada página -->
    {% block css %}
    {% endblock %}

</head>

<body>

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <!-- BOTÃO DO MENU MOBILE -->
    <button id="btnMenuMobile" class="btn-menu-mobile" type="button">
        <i class="bi bi-list"></i>
    </button>

    <aside id="menu">

        <button id="btn-minimizar" class="btn-minimizar" type="button" title="Minimizar menu">
            <span></span>
            <span></span>
            <span></span>
        </button>


        <div class="perfil">

            <img src="{{ url_for('static', filename='imagem/perfil.png') }}">

            <h3>{{ empresa_nome }}</h3>
        </div>


        <nav>

            <ul>

                <li class="nav-menu {% if request.path == '/dashboard' %}selected{% endif %}">

                    <a href="/dashboard">

                        <i class="bi bi-bar-chart-fill"></i>

                        DASHBOARD

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/galpao' %}selected{% endif %}">

                    <a href="/galpao">

                        <i class="bi bi-box-seam-fill"></i>

                        ESTOQUE

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/fornecedores' %}selected{% endif %}">

                    <a href="/fornecedores">

                        <i class="bi bi-people-fill"></i>

                        FORNECEDORES

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/pedidos' %}selected{% endif %}">

                    <a href="/pedidos">

                        <i class="bi bi-basket2-fill"></i>

                        PEDIDOS

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/clientes' %}selected{% endif %}">

                    <a href="/clientes">

                        <i class="bi bi-person-fill"></i>

                        CLIENTES

                    </a>

                </li>

            </ul>

        </nav>


        <!-- ========================= -->
        <!-- BOTÕES INFERIORES -->
        <!-- ========================= -->

        <div class="menu-opcoes">

            <a href="/config" class="opcoes-btn">

                <i class="bi bi-gear-fill"></i>

            </a>


            <button id="btnTema" class="opcoes-btn">

                <i id="iconeTema" class="bi bi-circle-half"></i>

            </button>


            <a href="{{ url_for('logout') }}" class="opcoes-btn red-opcoes-btn" onclick="return confirmarLogout()">

                <i class="bi bi-door-open-fill"></i>

            </a>

        </div>

    </aside>


    <!-- ========================= -->
    <!-- CONTEÚDO DA PÁGINA -->
    <!-- ========================= -->

    <div class="conteudo">

        {% block content %}
        {% endblock %}

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript do tema -->

    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>

    {% block javascript %}
    {% endblock %}

</body>

</html>
