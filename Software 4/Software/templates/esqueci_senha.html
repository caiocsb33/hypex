<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esqueci minha senha</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            <div class="alert-container">

                {% for categoria, mensagem in messages %}

                    <div class="alert alert-{{ 'success' if categoria == 'sucesso' else 'danger' }}">
                        {{ mensagem }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}


    <div class="container d-flex align-items-center justify-content-center login-container">

        <div class="login-card">

            <img
                src="{{ url_for('static', filename='imagem/logo.png') }}"
                alt="HypeX"
                class="logo"
            >

            <h2>RECUPERAR SENHA</h2>

            <p class="text-gray">
                Digite o email cadastrado para recuperar sua senha.
            </p>


            <form method="POST">

                <div class="mb-4">

                    <label class="form-label text-gray">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Digite seu email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login btn-primary w-100 text-white"
                >
                    Enviar
                </button>

            </form>


            <div class="mt-4">

                <a href="{{ url_for('login') }}">
                    Voltar para o login
                </a>

            </div>

        </div>

    </div>

</body>

</html>
