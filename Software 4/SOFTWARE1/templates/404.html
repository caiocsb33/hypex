<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>

     <link rel="stylesheet"
          href="{{ url_for('static', filename='style404.css') }}">

</head>

<body>

    <div class="layout">


        <!-- CONTEÚDO -->
        <main class="content">

            <div class="error-card">

                <div class="error-icon">
                    404
                </div>

                <h1>Página não encontrada</h1>

                <p>
                    Ops! A página que você está procurando
                    não existe ou foi movida.
                </p>

                <p class="error-description">
                    Verifique o endereço ou volte para o Dashboard
                    para continuar utilizando o sistema.
                </p>

                <a href="{{ url_for('dashboard') }}" class="back-button">
                  ← Voltar ao Dashboard
                </a>

            </div>

        </main>

    </div>

</body>
</html>
