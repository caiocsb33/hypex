<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Software HYPEX{% endblock %}</title>

    <script>
        if (localStorage.getItem("sidebarMinimizada") === "true") {
            document.documentElement.classList.add("sidebar-pre-minimizada");
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS global -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- CSS específico de cada página -->
    {% block css %}
    {% endblock %}

</head>

<body>

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->
    <!-- BOTÃO DO MENU MOBILE -->
    <button id="btnMenuMobile" class="btn-menu-mobile" type="button" aria-label="Abrir menu" aria-controls="menu"
        aria-expanded="false">

        <i class="bi bi-list" aria-hidden="true"></i>

    </button>

    <aside id="menu">

        <button id="btn-minimizar" class="btn-minimizar" type="button" aria-label="Minimizar menu" aria-expanded="true"
            title="Minimizar menu">
            <span></span>
            <span></span>
            <span></span>
        </button>


        <div class="perfil">

            <img src="{{ url_for('static', filename='imagem/perfil.png') }}" alt="Logo ou perfil da empresa">
            <h3>{{ empresa_nome }}</h3>
        </div>


        <nav aria-label="Menu principal">
            <ul>

                <li class="nav-menu {% if request.path == '/dashboard' %}selected{% endif %}">

                    <a href="/dashboard" aria-label="Dashboard">
                        <i class="bi bi-bar-chart-fill" aria-hidden="true"></i>
                        DASHBOARD

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/galpao' %}selected{% endif %}">

                    <a href="/galpao" aria-label="Estoque">
                        <i class="bi-box-seam-fill" aria-hidden="true"></i>

                        ESTOQUE

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/fornecedores' %}selected{% endif %}">

                    <a href="/fornecedores" aria-label="Fornecedores">
                        <i class="bi-people-fill" aria-hidden="true"></i>

                        FORNECEDORES

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/pedidos' %}selected{% endif %}">

                    <a href="/pedidos" aria-label="Pedidos">

                        <i class="bi-basket2-fill" aria-hidden="true"></i>

                        PEDIDOS

                    </a>

                </li>


                <li class="nav-menu {% if request.path == '/clientes' %}selected{% endif %}">

                    <a href="/clientes" aria-label="Clientes">

                        <i class="bi-person-fill" aria-hidden="true"></i>

                        CLIENTES

                    </a>

                </li>

            </ul>

        </nav>


        <!-- ========================= -->
        <!-- BOTÕES INFERIORES -->
        <!-- ========================= -->

        <div class="menu-opcoes">

            <a href="/config" class="opcoes-btn" aria-label="Configurações">
                <i class="bi bi-gear-fill" aria-hidden="true"></i>
            </a>

            <!-- BOTÃO DE LEITURA POR VOZ -->
            <button id="btnVoz" class="opcoes-btn" type="button" aria-label="Ativar leitura por voz"
                aria-pressed="false" title="Ativar leitura por voz">

                <i id="iconeVoz" class="bi bi-volume-mute-fill" aria-hidden="true"></i>

            </button>

            <button id="btnTema" class="opcoes-btn" type="button" aria-label="Ativar modo escuro">

                <i id="iconeTema" class="bi bi-circle-half" aria-hidden="true"></i>

            </button>

            <a href="{{ url_for('logout') }}" class="opcoes-btn red-opcoes-btn" aria-label="Sair"
                onclick="return confirmarLogout()">

                <i class="bi bi-door-open-fill" aria-hidden="true"></i>

            </a>

        </div>

    </aside>


    <!-- ========================= -->
    <!-- CONTEÚDO DA PÁGINA -->
    <!-- ========================= -->

    <main id="conteudo-principal" class="conteudo">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>

    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    
    <script src="{{ url_for('static', filename='js/acessibilidade.js') }}"></script>

    {% block javascript %}
    {% endblock %}
</body>

</html>
